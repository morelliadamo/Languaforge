# Selenide configuration for LanguaForge Angular 19 frontend
# Auto-read by Selenide from classpath (src/test/resources/)
selenide.baseUrl=http://localhost:4200
selenide.browser=chrome
selenide.timeout=6000
selenide.pageLoadTimeout=15000
selenide.headless=false
selenide.screenshots=true
selenide.savePageSource=false
selenide.reportsFolder=target/selenide-reports
